name: Generated JSON Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  generated-json-check:
    name: Verify manifest and metadata are up to date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Regenerate JSON files
        run: |
          yarn manifest
          yarn metadata

      - name: Check for generated file drift
        run: git diff --exit-code -- manifest.json metadata.json
